<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>الصفحة غير موجودة | HK Global Blog</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f172a" />

  <style>
    :root {
      --bg: #0f172a;
      --bg2: #111827;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary2: #1d4ed8;
      --shadow: 0 25px 70px rgba(2, 6, 23, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.35), transparent 34%),
        radial-gradient(circle at bottom left, rgba(245, 158, 11, 0.14), transparent 30%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .card {
      width: min(760px, 100%);
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 44px);
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      font-size: 24px;
      margin: 0 auto 18px;
      box-shadow: 0 14px 35px rgba(37, 99, 235, 0.35);
    }

    .code {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #eef2ff;
      color: #1e40af;
      padding: 9px 14px;
      border-radius: 999px;
      font-weight: 900;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.25;
      color: #0f172a;
    }

    p {
      color: #334155;
      line-height: 1.9;
      font-size: 17px;
      margin: 0 auto 22px;
      max-width: 560px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: 0.18s;
      font-family: inherit;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary2);
    }

    .btn-soft {
      background: #eef2ff;
      color: #1e40af;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
      margin-top: 22px;
      line-height: 1.7;
    }

    @media (max-width: 640px) {
      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">HK</div>
    <div class="code">404</div>

    <h1>الصفحة غير موجودة</h1>

    <p>
      الرابط الذي فتحته غير صحيح أو تم نقل الصفحة. يمكنك العودة إلى الصفحة الرئيسية وقراءة المقالات المنشورة.
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="./index.html">العودة للرئيسية</a>
      <button class="btn btn-soft" type="button" onclick="history.back()">رجوع للخلف</button>
    </div>

    <div class="muted">
      HK Global Blog © صفحة خطأ مخصصة
    </div>
  </main>
</body>
</html>
